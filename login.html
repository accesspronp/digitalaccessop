<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in or Sign Up | Digital Access Nepal</title>
<meta name="description" content="Log in or create your Digital Access Nepal account with Google or email.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.lp{max-width:440px;margin:0 auto;padding:36px 16px 60px}
.lpCard{background:#fff;border:1px solid rgba(7,152,196,.2);border-radius:22px;padding:24px;box-shadow:0 14px 34px rgba(7,40,70,.08)}
.lpCard[hidden]{display:none}
.lpTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.lpTabs button{padding:11px;border-radius:12px;border:1px solid #cfe6f2;background:#f6fbff;font:inherit;font-weight:800;cursor:pointer;color:#0b6b91}
.lpTabs button.on{background:#0798c4;color:#fff;border-color:#0798c4}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:12px;border:1px solid #d6e3ea;background:#fff;font:inherit;font-weight:800;cursor:pointer;color:#1f2d3a}
.gMark{font-weight:900;font-size:18px;color:#4285f4}
.or{text-align:center;color:#7a8a99;margin:14px 0;font-size:14px}
.lp label{display:block;font-weight:700;font-size:14px;margin:10px 0 0;color:#0b3550}
.lp input{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #cfe6f2;border-radius:10px;font:inherit}
.primary{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:#0798c4;color:#fff;font:inherit;font-weight:800;cursor:pointer}
.ghost{width:100%;margin-top:14px;padding:12px;border:1px solid #cfe6f2;border-radius:12px;background:#fff;color:#0b6b91;font:inherit;font-weight:800;cursor:pointer}
.lpMsg{font-size:14px;color:#b42318;min-height:20px;margin:12px 0 0}
.lpHead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lpHead small{display:block;color:#607386}
.lpAvatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#eef9ff}
.lpLinks{display:flex;gap:14px;margin-top:14px;font-weight:800}
.lpLinks a{color:#0b6b91}
.topbar .wrap.nav{position:relative}
</style>
</head>
<body>
<header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><img class="brandLogo" src="logo.png" alt="DigitalAccess Nepal"></a><nav class="links navExtra"><a class="pill" href="index.html">HOME</a><span id="authPill"></span></nav></div></header>
<main class="lp">
  <section class="lpCard" id="guestView">
    <div class="lpTabs"><button type="button" data-mode="login">Log in</button><button type="button" data-mode="signup">Create account</button></div>
    <button type="button" class="gbtn" id="googleBtn"><span class="gMark">G</span> Continue with Google</button>
    <div class="or">or use email</div>
    <form id="emailForm">
      <label class="nameField" hidden>Your name<input name="name" autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Password<input name="password" type="password" minlength="6" required autocomplete="current-password"></label>
      <button type="submit" class="primary" id="emailSubmit">Log in</button>
    </form>
    <p class="lpMsg" id="guestMsg" role="status"></p>
  </section>
  <section class="lpCard" id="userView" hidden>
    <div class="lpHead"><img id="uAvatar" class="lpAvatar" alt=""><div><b id="uName"></b><small id="uEmail"></small></div></div>
    <form id="usernameForm"><label>Username<input name="username" maxlength="30" required></label><button type="submit" class="primary">Save username</button></form>
    <div class="lpLinks"><a href="orders.html">My orders</a><a href="cart.html">My cart</a></div>
    <button type="button" class="ghost" id="logoutBtn">Log out</button>
    <p class="lpMsg" id="userMsg" role="status"></p>
  </section>
</main>
<footer style="text-align:center;padding:20px;font-size:14px"><a href="refund.html">Refund Policy</a> &middot; <a href="terms.html">Terms &amp; Conditions</a></footer>
<script src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="login.js"></script>
</body>
</html>
